# Éxodo Vecinal — nginx virtualhost
# Proxy a uvicorn en localhost:8000
#
# Instalar: sudo ln -s /etc/nginx/sites-available/exodovecinal /etc/nginx/sites-enabled/
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name exodovecinal.imaginabit.com;

    # Proxy todo a uvicorn (FastAPI sirve frontend + API)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts para queries RAG (pueden tardar)
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Logs separados
    access_log /var/log/nginx/exodovecinal_access.log;
    error_log /var/log/nginx/exodovecinal_error.log;
}
